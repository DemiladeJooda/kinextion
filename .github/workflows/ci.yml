name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push makes the in-flight run irrelevant — cancel it rather than
  # queueing behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, not committed — types fail without it.
      - run: pnpm --filter @kinextion/database generate

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Test
        run: pnpm --filter @kinextion/shared --filter @kinextion/api test

      - name: Build
        run: pnpm build
        env:
          # Build-time only. Real secrets live in the deploy environment;
          # these exist so Next.js can prerender without a live Clerk project.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
